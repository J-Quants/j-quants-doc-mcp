[project]
name = "j-quants-doc-mcp"
dynamic = ["version"]
description = "MCP server providing J-Quants API documentation, endpoint search, sample code generation, and FAQ support for Claude Desktop"
readme = "README.md"
authors = [
    { name = "JPX Market Innovation & Research, Inc." }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 4 - Beta",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
keywords = ["mcp", "j-quants", "api", "documentation"]

dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
    "Jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
j-quants-doc-mcp = "j_quants_doc_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/J-Quants/j-quants-doc-mcp"
Repository = "https://github.com/J-Quants/j-quants-doc-mcp"
"Bug Tracker" = "https://github.com/J-Quants/j-quants-doc-mcp/issues"

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "mcp>=1.16.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/j_quants_doc_mcp/__init__.py"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.10"
# patterns配下はサンプルコードを配置するため、厳格なlintは実施しない。
exclude = [
    "src/j_quants_doc_mcp/templates/patterns/",
]
